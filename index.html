<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг инфраструктуры</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 25px;
        }
        .counter-card {
            background-color: #1e1e1e;
            border: 4px solid #4caf50;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.2);
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .counter-card.danger {
            border-color: #ff3333;
            box-shadow: 0 10px 30px rgba(255, 51, 51, 0.3);
        }
        .title {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #cccccc;
        }
        .number {
            font-size: 8rem;
            font-weight: bold;
            color: #4caf50;
            margin: 10px 0;
        }
        .counter-card.danger .number {
            color: #ff3333;
        }
        .subtitle {
            font-size: 1.2rem;
            text-transform: uppercase;
            color: #888888;
            margin-top: 20px;
        }
        .incident-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 51, 0.4);
            transition: all 0.2s ease;
        }
        .incident-btn:hover {
            background-color: #e02424;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="counter-card" id="card">
        <div class="title">Статус инфраструктуры</div>
        <div class="number" id="days-counter">...</div>
        <div class="subtitle" id="days-text">установление связи...</div>
    </div>

    <button class="incident-btn" onclick="registerIncident()">Сбой!</button>

    <script>
        // Данные вашей базы данных
        const URL = "https://uqrlmgsglasbigifsgdw.supabase.co";
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxcmxtZ3NnbGFzYmlnaWZzZ2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDE4MjMsImV4cCI6MjI0NDcxNzgyM30.WKHQxVArYfsdhv1Zt5V8hB3_NJyG_nuoNzDRBs8WMI8";

        // Прямой fetch-запрос к Supabase без использования тяжелых внешних библиотек
        async function updateCounter() {
            try {
                const response = await fetch(`${URL}?id=eq.1`, {
                    method: 'GET',
                    headers: {
                        'apikey': KEY,
                        'Authorization': `Bearer ${KEY}`
                    }
                });

                if (!response.ok) throw new Error('Ошибка сети или ключа RLS');
                
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    document.getElementById('days-text').innerText = "Ошибка: Строка id=1 отсутствует";
                    return;
                }

                const lastDate = new Date(data[0].last_incident_date);
                const today = new Date();
                
                lastDate.setHours(0, 0, 0, 0);
                today.setHours(0, 0, 0, 0);
                
                const diffTime = today - lastDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const resultDays = diffDays < 0 ? 0 : diffDays;
                
                document.getElementById('days-counter').innerText = resultDays;
                
                const card = document.getElementById('card');
                if (resultDays === 0) {
                    card.classList.add('danger');
                } else {
                    card.classList.remove('danger');
                }
                
                document.getElementById('days-text').innerText = getDaysWord(resultDays) + " без сбоев";
            } catch (err) {
                console.error(err);
                document.getElementById('days-text').innerText = "Ошибка подключения к БД";
            }
        }

        async function registerIncident() {
            if (confirm("Вы уверены, что хотите обнулить счетчик для всей команды?")) {
                const todayStr = new Date().toISOString().split('T')[0];
                
                try {
                    const response = await fetch(`${URL}?id=eq.1`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': KEY,
                            'Authorization': `Bearer ${KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({ last_incident_date: todayStr })
                    });

                    if (!response.ok) throw new Error('Не удалось обнулить');
                    updateCounter();
                } catch (err) {
                    alert("Ошибка при сбросе: " + err.message);
                }
            }
        }

        function getDaysWord(number) {
            const lastDigit = number % 10;
            const lastTwoDigits = number % 100;
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) return 'дней';
            if (lastDigit === 1) return 'день';
            if (lastDigit >= 2 && lastDigit <= 4) return 'дня';
            return 'дней';
        }

        updateCounter();
        setInterval(updateCounter, 15000);
    </script>
</body>
</html>
